<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WareTrack · Vehicles (dev)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #eef1fa; }
      body { font: 500 13px/1.35 Inter, system-ui, sans-serif; color: #151a2d; }
      #viewport { position: fixed; inset: 0; }
      #viewport canvas { display: block; }
      .hud {
        position: fixed; top: 16px; left: 16px; padding: 12px 14px;
        background: rgba(255, 255, 255, 0.94); border: 1px solid rgba(222, 228, 242, 0.95);
        border-radius: 14px; box-shadow: 0 10px 30px rgba(36, 56, 120, 0.1), 0 1px 2px rgba(36, 56, 120, 0.06);
        backdrop-filter: saturate(160%) blur(14px);
      }
      .hud h1 { margin: 0 0 2px; font-size: 15px; font-weight: 700; }
      .hud p { margin: 0 0 10px; font-size: 11.5px; color: #8a92a6; }
      .hud .row { display: flex; flex-wrap: wrap; gap: 6px; max-width: 360px; }
      .hud button {
        font: 600 12px Inter, system-ui, sans-serif; color: #5d6579; cursor: pointer;
        padding: 6px 10px; border-radius: 8px; border: 1px solid #e3e7f1; background: #fff;
      }
      .hud button:hover { background: #f6f8fc; }
      .hud button.active { background: #2f5bea; border-color: #2f5bea; color: #fff; }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div class="hud">
      <h1>Vehicles</h1>
      <p>truck.js · forklift.js — left-drag pan · right-drag rotate · wheel zoom</p>
      <div class="row" id="views"></div>
      <div class="row" style="margin-top: 6px">
        <button id="animate">Animate</button>
      </div>
    </div>
    <script type="module" src="./vehicles.js"></script>
  </body>
</html>
