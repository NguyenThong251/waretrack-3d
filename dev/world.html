<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WareTrack · world</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Other agents edit modules (and .omc state files) constantly; every change makes Vite reload
      // the page. This dev page keeps the HMR socket silent unless ?live=1 (reload by hand instead).
      if (!new URLSearchParams(location.search).has('live')) {
        const NativeSocket = window.WebSocket
        window.WebSocket = function (url, protocols) {
          if (String(protocols).startsWith('vite-')) return { readyState: 0, addEventListener() {}, removeEventListener() {}, send() {}, close() {} }
          return new NativeSocket(url, protocols)
        }
        Object.assign(window.WebSocket, { CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3, prototype: NativeSocket.prototype })
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #eef1fa; font: 13px Inter, system-ui, sans-serif; color: #151a2d; }
      /* 1440 × 830 aspect, like the reference frames */
      #view { position: fixed; left: 0; top: 0; width: 100vw; height: calc(100vw * 830 / 1440); max-height: 100vh; }
      #hud { position: fixed; top: 10px; left: 10px; padding: 8px 10px; background: rgba(255,255,255,.92);
        border: 1px solid rgba(222,228,242,.95); border-radius: 10px; box-shadow: 0 10px 30px rgba(36,56,120,.10); z-index: 2; }
      #hud b { font-weight: 800; }
      #hud button { font: 600 12px Inter, system-ui, sans-serif; color: #2f5bea; background: #eaf0ff; border: 0;
        border-radius: 6px; padding: 4px 8px; margin: 0 2px; cursor: pointer; }
      #hud button.on { background: #2f5bea; color: #fff; }
      #stats { color: #8a92a6; font-size: 11.5px; margin-top: 4px; }
      #hud.clean { display: none; }
      /* other modules are built concurrently; their HMR errors are irrelevant here */
      vite-error-overlay { display: none; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="hud">
      <b>World</b> &nbsp;<span id="views"></span>
      <div id="stats"></div>
    </div>
    <script type="module" src="./world.js"></script>
  </body>
</html>
